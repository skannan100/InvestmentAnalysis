<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Portfolio Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#EDEAE1;
  --ink-dim:#9CA3B0;
  --bg:#0F1420;
  --panel:#171E2C;
  --panel-2:#1D2536;
  --line:#2A3346;
  --gold:#E3A008;
  --gold-soft:#4A3A14;
  --up:#4ADE94;
  --up-dim:#1E4030;
  --down:#F0725A;
  --down-dim:#442420;
  --radius:10px;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',sans-serif; padding:32px 24px 80px;
  min-height:100vh;
}
.wrap{max-width:1180px; margin:0 auto;}

header{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin-bottom:28px; border-bottom:1px solid var(--line); padding-bottom:20px;}
h1{font-family:'Fraunces',serif; font-weight:600; font-size:32px; margin:0 0 4px; letter-spacing:-0.01em;}
.sub{color:var(--ink-dim); font-size:14px;}
.refresh-note{font-size:12px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; text-align:right;}
.refresh-note b{color:var(--gold);}

.cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px;}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr);}}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;}
.card .label{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin-bottom:8px;}
.card .value{font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600;}
.card .delta{font-family:'IBM Plex Mono',monospace; font-size:13px; margin-top:6px;}
.pos{color:var(--up);} .neg{color:var(--down);}

.controls{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
input[type=text]{
  background:var(--panel); border:1px solid var(--line); color:var(--ink);
  padding:9px 14px; border-radius:8px; font-family:'Inter',sans-serif; font-size:13px; flex:1; min-width:180px;
}
select{
  background:var(--panel); border:1px solid var(--line); color:var(--ink);
  padding:9px 12px; border-radius:8px; font-family:'Inter',sans-serif; font-size:13px;
}
input::placeholder{color:var(--ink-dim);}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:right; padding:10px 12px; color:var(--ink-dim); font-weight:500; font-size:11px;
  text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--line); cursor:pointer; user-select:none;
  white-space:nowrap;
}
thead th:first-child, thead th:nth-child(2){text-align:left;}
thead th:hover{color:var(--gold);}
tbody tr{border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s;}
tbody tr:hover{background:var(--panel-2);}
td{padding:11px 12px; text-align:right; font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
td:first-child, td:nth-child(2){text-align:left; font-family:'Inter',sans-serif;}
.stock-name{font-weight:600;}
.sector-badge{
  font-size:10px; color:var(--ink-dim); font-family:'Inter',sans-serif;
  display:block; margin-top:1px;
}
.pnl-pct{font-weight:600;}
.stale{color:var(--ink-dim); font-style:italic; font-size:11px;}

.detail-row td{background:var(--panel); text-align:left; font-family:'Inter',sans-serif; padding:16px 20px;}
.detail-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
@media(max-width:800px){.detail-grid{grid-template-columns:repeat(2,1fr);}}
.detail-item .k{font-size:11px; text-transform:uppercase; color:var(--ink-dim); letter-spacing:.05em; margin-bottom:4px;}
.detail-item .v{font-family:'IBM Plex Mono',monospace; font-size:15px;}
.range-bar{height:6px; background:var(--line); border-radius:3px; margin-top:8px; position:relative;}
.range-fill{position:absolute; top:-3px; width:2px; height:12px; background:var(--gold); border-radius:1px;}

footer{margin-top:30px; font-size:12px; color:var(--ink-dim); text-align:center;}
footer a{color:var(--gold); text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Portfolio Ledger</h1>
      <div class="sub" id="stockCount">Loading…</div>
    </div>
    <div class="refresh-note" id="refreshNote">Loading…</div>
  </header>

  <div class="cards">
    <div class="card"><div class="label">Invested</div><div class="value" id="cInvested">—</div></div>
    <div class="card"><div class="label">Current Value</div><div class="value" id="cCurrent">—</div></div>
    <div class="card"><div class="label">Total P&amp;L</div><div class="value" id="cPnl">—</div></div>
    <div class="card"><div class="label">Overall Return</div><div class="value" id="cPnlPct">—</div></div>
  </div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search by stock name or sector…">
    <select id="sectorFilter"><option value="">All sectors</option></select>
    <select id="sortBy">
      <option value="name">Sort: Name</option>
      <option value="pnlPct" selected>Sort: P&amp;L %</option>
      <option value="pnlAbs">Sort: P&amp;L ₹</option>
      <option value="value">Sort: Current Value</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Stock</th><th>Sector</th><th>Qty</th><th>Avg Cost</th><th>Invested</th>
        <th>Current Value</th><th>P&amp;L ₹</th><th>P&amp;L %</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <footer>Data sourced from local DuckDB portfolio database · Investment cost, quantity &amp; latest value from your portfolio sheet</footer>
</div>

<script>
const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');
const fmtPct = n => (n>=0?'+':'') + n.toFixed(1) + '%';

let holdings = [];

/**
 * Fetch holdings from local DuckDB backend
 * Expects endpoint: /api/holdings or similar
 */
async function loadHoldings(){
  try {
    const response = await fetch('/api/holdings');
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    holdings = await response.json();
    console.log('Holdings loaded from DuckDB:', holdings.length, 'records');
  } catch (error) {
    console.error('Failed to load holdings from DuckDB:', error);
    // Fallback: show error state
    document.getElementById('refreshNote').textContent = 'Failed to connect to portfolio database';
    return;
  }
  render();
}

function populateSectorFilter(){
  const sel = document.getElementById('sectorFilter');
  // Clear existing options (keep the "All sectors" option)
  while (sel.options.length > 1) {
    sel.remove(1);
  }
  const sectors = [...new Set(holdings.map(h => {
    const primary = h.sector.split(' · ')[0];
    return primary;
  }))].sort();
  
  sectors.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    sel.appendChild(opt);
  });
}

function render(){
  if (holdings.length === 0) {
    document.getElementById('stockCount').textContent = 'No holdings loaded';
    return;
  }

  const totalInvested = holdings.reduce((a,h)=>a+h.invested,0);
  const totalValue = holdings.reduce((a,h)=>a+h.value,0);
  const totalPnl = totalValue - totalInvested;
  const totalPnlPct = (totalPnl/totalInvested)*100;

  document.getElementById('cInvested').textContent = fmt(totalInvested);
  document.getElementById('cCurrent').textContent = fmt(totalValue);
  document.getElementById('stockCount').textContent = holdings.length + ' holdings';
  
  const pnlEl = document.getElementById('cPnl');
  pnlEl.textContent = (totalPnl>=0?'+':'') + fmt(totalPnl);
  pnlEl.className = 'value ' + (totalPnl>=0?'pos':'neg');
  
  const pnlPctEl = document.getElementById('cPnlPct');
  pnlPctEl.textContent = fmtPct(totalPnlPct);
  pnlPctEl.className = 'value ' + (totalPnlPct>=0?'pos':'neg');

  const mostRecent = holdings.filter(h=>h.lastUpdated).sort((a,b)=>{
    const dateA = new Date(a.lastUpdated);
    const dateB = new Date(b.lastUpdated);
    return dateB - dateA;
  })[0];
  
  const liveCount = holdings.filter(h=>h.lastUpdated).length;
  document.getElementById('refreshNote').innerHTML =
    `<b>${liveCount}/${holdings.length}</b> stocks with live data${mostRecent ? ' · latest: ' + mostRecent.lastUpdated : ''}`;

  populateSectorFilter();
  renderTable();
}

function renderTable(){
  const q = document.getElementById('search').value.toLowerCase();
  const sectorF = document.getElementById('sectorFilter').value;
  const sortBy = document.getElementById('sortBy').value;

  let rows = holdings.map(h=>({
    ...h, 
    pnlAbs: h.value - h.invested, 
    pnlPct: ((h.value - h.invested) / h.invested) * 100
  }));

  rows = rows.filter(h =>
    (h.name.toLowerCase().includes(q) || h.sector.toLowerCase().includes(q)) &&
    (!sectorF || h.sector.startsWith(sectorF))
  );

  rows.sort((a,b)=>{
    if(sortBy==='name') return a.name.localeCompare(b.name);
    if(sortBy==='pnlPct') return b.pnlPct - a.pnlPct;
    if(sortBy==='pnlAbs') return b.pnlAbs - a.pnlAbs;
    if(sortBy==='value') return b.value - a.value;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  rows.forEach(h=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="stock-name">${h.name}</span><span class="sector-badge">${h.ticker}</span></td>
      <td style="font-size:12px;color:var(--ink-dim);">${h.sector}</td>
      <td>${h.qty}</td>
      <td>${fmt(h.avgCost)}</td>
      <td>${fmt(h.invested)}</td>
      <td>${fmt(h.value)}</td>
      <td class="${h.pnlAbs>=0?'pos':'neg'}">${h.pnlAbs>=0?'+':''}${fmt(h.pnlAbs)}</td>
      <td class="pnl-pct ${h.pnlPct>=0?'pos':'neg'}">${fmtPct(h.pnlPct)}</td>
    `;
    tr.addEventListener('click', ()=>toggleDetail(tr, h));
    tbody.appendChild(tr);
  });
}

function toggleDetail(tr, h){
  const next = tr.nextElementSibling;
  if(next && next.classList.contains('detail-row')){ next.remove(); return; }
  document.querySelectorAll('.detail-row').forEach(r=>r.remove());

  const dtr = document.createElement('tr');
  dtr.className = 'detail-row';
  const td = document.createElement('td');
  td.colSpan = 8;

  if(h.pe===null || h.pe===undefined){
    td.innerHTML = `<span class="stale">Live fundamentals (P/E, market cap, 52-week range) not yet fetched for ${h.name}. Refresh data in DuckDB to pull current metrics.</span>`;
  } else {
    const range = h.w52h - h.w52l;
    const price = h.value / h.qty;
    const pos = Math.min(100, Math.max(0, ((price - h.w52l)/range)*100));
    const thesis = h.assessment && h.assessment.thesis;
    td.innerHTML = `
      <div class="detail-grid">
        <div class="detail-item"><div class="k">P/E Ratio</div><div class="v">${h.pe}</div></div>
        <div class="detail-item"><div class="k">Market Cap</div><div class="v">${h.marketCap || '—'}</div></div>
        <div class="detail-item"><div class="k">Current Price (implied)</div><div class="v">${fmt(price)}</div></div>
        <div class="detail-item"><div class="k">Data as of</div><div class="v" style="font-size:13px;">${h.lastUpdated || '—'}</div></div>
      </div>
      <div class="detail-item" style="margin-top:16px;">
        <div class="k">52-Week Range: ${fmt(h.w52l)} — ${fmt(h.w52h)}</div>
        <div class="range-bar"><div class="range-fill" style="left:${pos}%;"></div></div>
      </div>
      ${thesis ? `
      <div class="thesis-block">
        <div class="thesis-head"><span class="thesis-label">Why own this</span><span class="moat-badge">${thesis.moatType}</span></div>
        <p class="thesis-text">${thesis.summary}</p>
      </div>` : `
      <div class="thesis-block thesis-pending">
        <span class="thesis-label">Why own this</span>
        <p class="thesis-text stale">Not yet assessed.</p>
      </div>`}
    `;
  }
  dtr.appendChild(td);
  tr.after(dtr);
}

document.getElementById('search').addEventListener('input', renderTable);
document.getElementById('sectorFilter').addEventListener('change', renderTable);
document.getElementById('sortBy').addEventListener('change', renderTable);

loadHoldings();
</script>
</body>
</html>
